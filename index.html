  <body>
    <script>
      // Redirect /Blog (no trailing slash) to /Blog/ for GitHub Pages / static hosts
      (function () {
        var p = window.location.pathname;
        var base = "/Blog";
        if (p === base || p === base.toLowerCase()) {
          window.location.replace(base + "/" + window.location.search + window.location.hash);
        }
      })();
    </script>
    <div id="root"></div>
    <script>
      // Restore path from GitHub Pages SPA redirect
      (function () {
        var l = window.location;
        if (l.search && l.search.charAt(1) === "/") {
          var decoded = l.search.slice(1).split("&").map(function (s) { return s.replace(/~and~/g, "&"); }).join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
