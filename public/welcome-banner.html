<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenidos a TheVibeBlog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background-color: #ffffff;
      color: #1a1a1a;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    .banner {
      min-height: 600px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 4rem 2rem;
      background: linear-gradient(135deg, #fafafa 0%, #f2f2f2 100%);
      position: relative;
      overflow: hidden;
    }

    .banner::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 80%, rgba(29, 78, 216, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(29, 78, 216, 0.03) 0%, transparent 50%);
      pointer-events: none;
    }

    .logo {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #0a0a0a;
      margin-bottom: 3rem;
    }

    .title {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 4.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.05;
      color: #0a0a0a;
      margin-bottom: 1.5rem;
      text-wrap: balance;
    }

    .subtitle {
      font-family: "Lora", Georgia, serif;
      font-size: 1.5rem;
      font-style: italic;
      color: #6b6b6b;
      max-width: 600px;
      line-height: 1.6;
    }

    .divider {
      width: 80px;
      height: 3px;
      background-color: #0a0a0a;
      margin: 2rem auto;
    }

    .tagline {
      font-family: "Inter", system-ui, sans-serif;
      font-size: 0.875rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #9a9a9a;
      margin-top: 3rem;
    }

    @media (max-width: 768px) {
      .title {
        font-size: 3rem;
      }
      .subtitle {
        font-size: 1.25rem;
      }
      .banner {
        min-height: 400px;
        padding: 2rem 1rem;
      }
    }

    /* Dark mode support */
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #0f0f0f;
        color: #e5e5e5;
      }
      .banner {
        background: linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 100%);
      }
      .banner::before {
        background: 
          radial-gradient(circle at 20% 80%, rgba(29, 78, 216, 0.1) 0%, transparent 50%),
          radial-gradient(circle at 80% 20%, rgba(29, 78, 216, 0.05) 0%, transparent 50%);
      }
      .logo, .title {
        color: #fafafa;
      }
      .subtitle {
        color: #9a9a9a;
      }
      .divider {
        background-color: #fafafa;
      }
      .tagline {
        color: #6b6b6b;
      }
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="logo">TheVibeBlog</div>
    <h1 class="title">Bienvenidos a TheVibeBlog</h1>
    <div class="divider"></div>
    <p class="subtitle">Ideas que vibran. Un espacio para compartir pensamientos, historias y conocimiento.</p>
    <p class="tagline">100% Vibecoded · Powered by AI</p>
  </div>
</body>
</html>
